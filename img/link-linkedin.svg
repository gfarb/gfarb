<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64" role="img" aria-label="LinkedIn">
<style>
.label{font:400 22px Georgia,'Iowan Old Style','Times New Roman',serif;fill:#fff6ea;letter-spacing:.5px}
.sweep{animation:sweep 5s ease-in-out 2.5s infinite}
@keyframes sweep{0%{transform:translateX(-120px)}35%,100%{transform:translateX(300px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.sweep{display:none}}
</style>
<defs>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#ff6b6b"/>
<stop offset=".5" stop-color="#ffc28a"/>
<stop offset="1" stop-color="#6a4f7e"/>
</linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2a2452"/>
<stop offset="1" stop-color="#121633"/>
</linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#fff" stop-opacity="0"/>
<stop offset=".5" stop-color="#ffd9bd" stop-opacity=".28"/>
<stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<clipPath id="pill"><rect x="2" y="2" width="236" height="60" rx="30.0"/></clipPath>
</defs>
<rect x="2" y="2" width="236" height="60" rx="30.0" fill="url(#bg)"/>
<g clip-path="url(#pill)"><g transform="skewX(-20)"><rect class="sweep" x="0" y="-20" width="70" height="104" fill="url(#shine)"/></g></g>
<rect x="2" y="2" width="236" height="60" rx="30.0" fill="none" stroke="url(#edge)" stroke-width="2"/>
<g>
<rect x="20" y="18" width="28" height="28" rx="7" fill="#ffb27a"/>
<text x="34" y="40" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700" font-size="18" fill="#1b1838">in</text>
</g>
<text class="label" x="146" y="40" text-anchor="middle">LinkedIn</text>
</svg>
