<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Max Goldfarb. Software engineer at GitHub. A sunset over the ocean.">
<style>
.star{fill:#fff4e0;animation:twinkle ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
.sun{animation:sink 14s ease-in-out infinite alternate}
@keyframes sink{to{transform:translateY(16px)}}
.glow{animation:breathe 6s ease-in-out infinite alternate;transform-origin:600px 288px}
@keyframes breathe{from{opacity:.55;transform:scale(.94)}to{opacity:.9;transform:scale(1.06)}}
.shim{fill:#ffd2a1;opacity:.6;animation:shimmer 3.6s ease-in-out infinite}
@keyframes shimmer{0%,100%{opacity:.25;transform:translateX(-6px)}50%{opacity:.95;transform:translateX(6px)}}
.w1{animation:drift-w1 16s linear infinite normal}@keyframes drift-w1{to{transform:translateX(-180px)}}.w2{animation:drift-w2 12s linear infinite reverse}@keyframes drift-w2{to{transform:translateX(-260px)}}.w3{animation:drift-w3 9s linear infinite normal}@keyframes drift-w3{to{transform:translateX(-340px)}}
.glide{animation:glide linear infinite}
@keyframes glide{from{transform:translateX(-60px)}to{transform:translateX(1260px)}}
.gull{fill:none;stroke:#1b1630;stroke-width:2.4;stroke-linecap:round;animation:flap 1.1s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleY(.35)}}
.title{font:400 66px Georgia,'Iowan Old Style','Times New Roman',serif;fill:#fff6ea;letter-spacing:3px;animation:rise 1.6s ease-out both}
.sub{font:500 15px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#ffd9bd;letter-spacing:6px;animation:rise 1.6s ease-out .5s both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.glide{display:none}}
</style>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0d1030"/>
<stop offset=".38" stop-color="#3a2f63"/>
<stop offset=".66" stop-color="#b8546f"/>
<stop offset=".86" stop-color="#ee8a68"/>
<stop offset="1" stop-color="#ffc28a"/>
</linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#6a4f7e"/>
<stop offset=".25" stop-color="#2f3563"/>
<stop offset="1" stop-color="#0e1530"/>
</linearGradient>
<radialGradient id="sunfill" cx=".5" cy=".4" r=".6">
<stop offset="0" stop-color="#fff2c4"/>
<stop offset=".6" stop-color="#ffc07a"/>
<stop offset="1" stop-color="#ff8a5c"/>
</radialGradient>
<radialGradient id="pool">
<stop offset="0" stop-color="#ffb07a" stop-opacity=".45"/>
<stop offset="1" stop-color="#ffb07a" stop-opacity="0"/>
</radialGradient>
<radialGradient id="halo">
<stop offset="0" stop-color="#ffb27a" stop-opacity=".8"/>
<stop offset="1" stop-color="#ff7a6b" stop-opacity="0"/>
</radialGradient>
<clipPath id="above"><rect width="1200" height="288"/></clipPath>
<clipPath id="frame"><rect width="1200" height="420" rx="18"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="288" fill="url(#sky)"/>
<circle cx="396" cy="41" r="0.8" class="star" style="animation-duration:2.8s;animation-delay:-2.7s"/><circle cx="444" cy="24" r="1" class="star" style="animation-duration:2.6s;animation-delay:-2.2s"/><circle cx="101" cy="30" r="1.5" class="star" style="animation-duration:2.7s;animation-delay:-2.8s"/><circle cx="1119" cy="125" r="0.8" class="star" style="animation-duration:4.5s;animation-delay:-2.0s"/><circle cx="1152" cy="22" r="1" class="star" style="animation-duration:3.5s;animation-delay:-0.7s"/><circle cx="157" cy="68" r="1" class="star" style="animation-duration:2.9s;animation-delay:-2.9s"/><circle cx="238" cy="31" r="0.8" class="star" style="animation-duration:4.5s;animation-delay:-3.1s"/><circle cx="922" cy="96" r="1.5" class="star" style="animation-duration:3.8s;animation-delay:-1.2s"/><circle cx="229" cy="151" r="0.8" class="star" style="animation-duration:4.5s;animation-delay:-2.6s"/><circle cx="1035" cy="142" r="1.2" class="star" style="animation-duration:4.6s;animation-delay:-0.4s"/><circle cx="614" cy="43" r="1.2" class="star" style="animation-duration:3.0s;animation-delay:-2.4s"/><circle cx="65" cy="132" r="1.2" class="star" style="animation-duration:3.7s;animation-delay:-1.8s"/><circle cx="100" cy="30" r="1.2" class="star" style="animation-duration:4.2s;animation-delay:-3.3s"/><circle cx="90" cy="137" r="1.5" class="star" style="animation-duration:3.5s;animation-delay:-1.9s"/><circle cx="796" cy="18" r="1.5" class="star" style="animation-duration:3.7s;animation-delay:-3.1s"/><circle cx="593" cy="52" r="1.2" class="star" style="animation-duration:3.0s;animation-delay:-1.2s"/><circle cx="113" cy="93" r="1.2" class="star" style="animation-duration:5.6s;animation-delay:-4.1s"/><circle cx="1022" cy="63" r="1.5" class="star" style="animation-duration:6.0s;animation-delay:-3.4s"/><circle cx="461" cy="55" r="0.8" class="star" style="animation-duration:3.1s;animation-delay:-1.2s"/><circle cx="291" cy="99" r="1" class="star" style="animation-duration:3.4s;animation-delay:-0.0s"/><circle cx="83" cy="172" r="1.5" class="star" style="animation-duration:3.9s;animation-delay:-2.0s"/><circle cx="241" cy="187" r="1.5" class="star" style="animation-duration:3.1s;animation-delay:-1.7s"/><circle cx="81" cy="14" r="1" class="star" style="animation-duration:4.4s;animation-delay:-4.7s"/><circle cx="732" cy="26" r="1" class="star" style="animation-duration:4.6s;animation-delay:-0.7s"/><circle cx="442" cy="36" r="1.5" class="star" style="animation-duration:6.0s;animation-delay:-2.3s"/><circle cx="581" cy="29" r="0.8" class="star" style="animation-duration:5.1s;animation-delay:-3.7s"/><circle cx="619" cy="50" r="1.2" class="star" style="animation-duration:3.0s;animation-delay:-2.7s"/><circle cx="51" cy="107" r="0.8" class="star" style="animation-duration:4.9s;animation-delay:-1.3s"/><circle cx="445" cy="43" r="1" class="star" style="animation-duration:4.4s;animation-delay:-3.9s"/><circle cx="402" cy="53" r="1" class="star" style="animation-duration:5.3s;animation-delay:-4.1s"/><circle cx="878" cy="54" r="1.5" class="star" style="animation-duration:3.7s;animation-delay:-0.1s"/><circle cx="52" cy="63" r="1.2" class="star" style="animation-duration:3.2s;animation-delay:-3.0s"/><circle cx="1150" cy="28" r="0.8" class="star" style="animation-duration:3.3s;animation-delay:-1.0s"/><circle cx="257" cy="124" r="0.8" class="star" style="animation-duration:4.2s;animation-delay:-3.3s"/>
<g clip-path="url(#above)">
<circle class="glow" cx="600" cy="288" r="230" fill="url(#halo)"/>
<circle class="sun" cx="600" cy="266" r="74" fill="url(#sunfill)"/>
</g>
<rect y="288" width="1200" height="132" fill="url(#sea)"/>
<g class="w1"><path d="M0 302 Q45.0 298 90.0 302 T180.0 302 T270.0 302 T360.0 302 T450.0 302 T540.0 302 T630.0 302 T720.0 302 T810.0 302 T900.0 302 T990.0 302 T1080.0 302 T1170.0 302 T1260.0 302 T1350.0 302 T1440.0 302 L1440.0 420 L0 420 Z" fill="#2c3f6b" fill-opacity="0.55"/></g><g class="w2"><path d="M0 334 Q65.0 328 130.0 334 T260.0 334 T390.0 334 T520.0 334 T650.0 334 T780.0 334 T910.0 334 T1040.0 334 T1170.0 334 T1300.0 334 T1430.0 334 T1560.0 334 L1560.0 420 L0 420 Z" fill="#1f2f55" fill-opacity="0.7"/></g><g class="w3"><path d="M0 374 Q85.0 365 170.0 374 T340.0 374 T510.0 374 T680.0 374 T850.0 374 T1020.0 374 T1190.0 374 T1360.0 374 T1530.0 374 T1700.0 374 L1700.0 420 L0 420 Z" fill="#16223f" fill-opacity="0.85"/></g>
<ellipse cx="600" cy="328" rx="220" ry="70" fill="url(#pool)"/>
<rect x="532" y="298" width="150" height="3" rx="1.5" class="shim" style="animation-delay:-0.00s"/><rect x="530" y="310" width="120" height="3" rx="1.5" class="shim" style="animation-delay:-0.45s"/><rect x="519" y="324" width="170" height="3" rx="1.5" class="shim" style="animation-delay:-0.90s"/><rect x="565" y="338" width="90" height="3" rx="1.5" class="shim" style="animation-delay:-1.35s"/><rect x="542" y="354" width="130" height="3" rx="1.5" class="shim" style="animation-delay:-1.80s"/><rect x="571" y="372" width="70" height="3" rx="1.5" class="shim" style="animation-delay:-2.25s"/><rect x="549" y="392" width="100" height="3" rx="1.5" class="shim" style="animation-delay:-2.70s"/><rect x="567" y="412" width="50" height="3" rx="1.5" class="shim" style="animation-delay:-3.15s"/>
<g class="glide" style="animation-duration:38s;animation-delay:0s"><g transform="translate(0 112) scale(0.9)"><path d="M-12 0 Q-6 -7 0 0 Q6 -7 12 0" class="gull" style="animation-delay:-0.0s"/></g></g><g class="glide" style="animation-duration:46s;animation-delay:-14s"><g transform="translate(0 140) scale(0.65)"><path d="M-12 0 Q-6 -7 0 0 Q6 -7 12 0" class="gull" style="animation-delay:-0.3s"/></g></g><g class="glide" style="animation-duration:52s;animation-delay:-30s"><g transform="translate(0 96) scale(0.5)"><path d="M-12 0 Q-6 -7 0 0 Q6 -7 12 0" class="gull" style="animation-delay:-0.6s"/></g></g>
